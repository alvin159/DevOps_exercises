stages:
  - build
  - test
  - static_analysis
  - deploy

build-services:
  stage: build
  image: docker:24.0
  services:
    - name: docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://192.168.65.7:2375
    DOCKER_DRIVER: overlay2
  script:
    - docker info
    - docker-compose build

test:
  stage: test
  image: docker:24.0
  services:
    - name: docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://192.168.65.7:2375
    DOCKER_DRIVER: overlay2
  script:
    - echo "Running tests"
    - docker-compose up
    - docker build -t tests-image ./tests
    - docker run --rm tests-image

static_analysis:
  stage: static_analysis
  script:
    - echo "Running static analysis"
    - pip install pylint
    - pylint service1/app.py
    - pylint service2/app.js

deploy:
  stage: deploy
  script:
    - echo "Deploying to production"
    - ssh -i /home/alvin/.ssh/Indomie.pem ubuntu@86.50.168.146 "cd DevOps_exercises && git pull && docker-compose -f docker-compose.yaml up -d"
  only:
    - project
